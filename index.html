<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ossei — Mapa da Cidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: palco 3D de altura total à esquerda, coluna de dossiê à direita. Visual escuro único, por escolha. */
:root {
  --bg: #070b12;
  --panel: #0c1320;
  --panel-2: #111b2b;
  --line: #1d2b40;
  --fg: #d6dfeb;
  --muted: #8393ab;
  --accent: #f2b544;
  --accent-ink: #1a1203;
  --display: "Chakra Petch", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body); overflow: hidden; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.stage { position: relative; min-width: 0; min-height: 0; background: var(--bg); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
.label-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.dlabel {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase;
  color: var(--fg); background: rgba(7, 11, 18, .78); border: 1px solid var(--line);
  padding: 5px 8px; white-space: nowrap; will-change: transform;
}
.dlabel i { display: inline-block; width: 8px; height: 8px; margin-right: 7px; vertical-align: -1px; }
.dlabel[data-on="true"] { border-color: var(--accent); color: #fff; }
.slabel {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  font: 500 10px/1 var(--mono); letter-spacing: .04em; color: var(--fg);
  background: rgba(7, 11, 18, .6); padding: 3px 5px; white-space: nowrap; will-change: transform;
}
.slabel::before { content: "\25C6"; color: var(--accent); margin-right: 5px; font-size: 8px; vertical-align: 1px; }
.tip {
  position: absolute; pointer-events: none; z-index: 3; padding: 6px 9px;
  font: 500 12px/1.3 var(--body); background: var(--panel); border: 1px solid var(--line); color: var(--fg);
  transform: translate(14px, 14px); white-space: nowrap;
}
.tip small { display: block; color: var(--muted); font: 400 11px/1.3 var(--mono); }
.hint {
  position: absolute; left: 16px; bottom: 14px; right: 16px; pointer-events: none;
  font: 400 11px/1.4 var(--mono); color: var(--muted); letter-spacing: .02em;
}
.compass {
  position: absolute; right: 16px; top: 14px; pointer-events: none;
  font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
}
aside { min-height: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 700 26px/1.1 var(--display); letter-spacing: .02em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); font-size: 13px; }
.chip {
  align-self: flex-start; font: 500 11px/1.3 var(--mono); padding: 5px 7px; color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
}
h2 { margin: 0 0 8px; font: 600 12px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.layers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.layer {
  text-align: left; padding: 9px 10px; background: transparent; color: var(--fg); border: 1px solid var(--line); cursor: pointer;
  font: 600 12px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase;
}
.layer small { display: block; margin-top: 4px; font: 400 10px/1.2 var(--mono); letter-spacing: .04em; color: var(--muted); text-transform: none; }
.layer:hover { background: var(--panel-2); }
.layer[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-2); color: #fff; }
.dossier { border: 1px solid var(--line); background: var(--panel-2); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.dossier h3 { margin: 0; font: 700 22px/1.15 var(--display); text-wrap: balance; }
.kind { font: 500 11px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.kind i { width: 10px; height: 10px; display: inline-block; flex: none; }
.dossier p { margin: 0; color: var(--fg); max-width: 62ch; }
.dossier p.ctl { font: 400 12px/1.4 var(--mono); color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { border-top: 1px solid var(--line); padding-top: 6px; min-width: 0; }
.stat b { display: block; font: 500 16px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font: 400 11px/1.3 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pips { display: flex; gap: 4px; align-items: center; font: 500 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.pips span.p { width: 18px; height: 6px; background: var(--line); }
.pips span.p.on { background: var(--accent); }
.sub { display: flex; flex-direction: column; gap: 4px; }
.sub ul { margin: 0; padding-left: 18px; color: var(--fg); }
.sub li { margin: 2px 0; }
.sub li b { font-weight: 500; color: #fff; }
.sub h4 { margin: 0; font: 600 11px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 6px; }
.list h5 { margin: 8px 0 0; font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.list h5:first-child { margin-top: 0; }
.list p { margin: 0; font: 400 12px/1.5 var(--mono); color: var(--muted); }
.row {
  display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left;
  width: 100%; padding: 9px 10px; background: transparent; color: var(--fg); border: 1px solid var(--line);
  font: 500 13px/1.2 var(--body); cursor: pointer;
}
.row:hover { background: var(--panel-2); }
.row[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-2); }
.row i { width: 12px; height: 12px; display: block; }
.row em { font: 400 11px/1 var(--mono); font-style: normal; color: var(--muted); }
button:focus-visible, input:focus-visible, .dlabel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.view { display: flex; flex-direction: column; gap: 12px; }
.btn {
  align-self: flex-start; background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 8px 12px;
  font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
}
.btn:hover { background: var(--panel-2); }
.check { display: flex; align-items: center; gap: 8px; font: 400 13px/1.2 var(--body); color: var(--fg); }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.scale { font: 400 11px/1.5 var(--mono); color: var(--muted); }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 48%); }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  h1 { font-size: 22px; }
  .hint { display: none; }
}
</style>
</head>
<body>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="Mapa 3D de Ossei. Arraste para orbitar, role para aproximar, arraste com o botão direito para mover."></canvas>
    <div class="label-layer" id="labels"></div>
    <div class="tip" id="tip" hidden></div>
    <div class="compass" id="compass"></div>
    <div class="hint">Arraste para orbitar &middot; role para aproximar &middot; botão direito para mover &middot; clique em uma zona</div>
  </div>
  <aside>
    <div class="head">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="cityName"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <section>
      <h2>Camada</h2>
      <div class="layers" id="layers"></div>
    </section>
    <section>
      <h2>Dossiê</h2>
      <div class="dossier" id="dossier" aria-live="polite"></div>
    </section>
    <section>
      <h2>Zonas</h2>
      <div class="list" id="list"></div>
    </section>
    <section>
      <h2>Visualização</h2>
      <div class="view">
        <label class="check"><input id="showLabels" type="checkbox" checked> Mostrar rótulos das zonas</label>
        <label class="check"><input id="showSites" type="checkbox" checked> Mostrar locais nomeados</label>
        <button class="btn" id="reset" type="button">Restaurar vista</button>
        <div class="scale" id="scale"></div>
      </div>
    </section>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  "use strict";

  /* DATA:BEGIN */
  /* ------------------------------------------------------------------
     CONFIG — VERSÃO DOS JOGADORES. Só o que qualquer morador de Ossei sabe.
     Grade: 67 x 67 células, 1 célula = 10 m, 1 unidade = 5 m. Célula [i, j]: i cresce para leste, j para sul.
     ------------------------------------------------------------------ */
  var CITY = {
    name: "Ossei", seed: 1138, maxHeightM: 60, blocksPerSide: 11, blockSize: 5, cell: 2,
    title: "Ossei — Mapa da Cidade",
    eyebrow: "Vethara · Mapa da cidade",
    lede: "Cidade vertical e torta, empilhada sobre os eixos e pilares de uma velha estação mineradora republicana.",
    section: "A cidade em corte: as ruas em cima, as fundações da velha estação logo abaixo e, sob elas, o que ninguém mapeou. As colunas verde-água são os poços dos hangares do Porto Baixo.",
    npcLabel: "Figuras conhecidas",
    flagship: -1
  };

  var SHAFTS = [];

  // Prédios nomeados da superfície: [zona, i, j, largura, profundidade, altura, mastro]
  var LANDMARKS = [
    ["casco", 31, 14, 2, 1, 1.4, 0],
    ["casco", 38, 19, 1, 1, 1.6, 0],
    ["imperial", 26, 38, 3, 3, 3, 3.5],
    ["limpo", 13, 44, 4, 3, 2.4, 2.5]
  ];

  var LAYERS = [
    { id: "surface", name: "Superfície", sub: "Ruas e pilhas", level: "0",
      blurb: "O nível da rua e tudo o que se empilhou por cima. A chuva ácida, as tempestades de 180 km/h e os relâmpagos roxos mantêm Ossei baixa: nada passa de 60 m, e as únicas linhas retas pertencem ao Império.",
      zones: [
        { id: "casco", name: "Casco Velho", kind: "Bairro antigo", color: "#c8743a", at: [0.42, 0.22],
          h: [3, 10], density: 0.93, tower: 0.08, clutter: 0.14, bridge: 0.16, threat: 2,
          control: "Os Cavaeiros de Ossei",
          blurb: "As pilhas mais antigas da cidade, erguidas direto sobre os pilares da velha estação mineradora. Andares novos de sucata assentam tortos sobre fundações velhas, e passagens cobertas ligam prédios que nunca foram feitos para se tocar. Cheira a solda, óleo de droid e café queimado.",
          sites: [
            { name: "Daan & Associados — Reparos", at: [31, 14], note: "Oficina mecânica larga e baixa, ao nível do solo. Cobra menos do que devia. O letreiro perde uma letra a cada estação." },
            { name: "A Ferrugem Dourada", at: [38, 19], note: "Cantina de piso de placas enferrujadas, iluminada por lanternas de plasma penduradas. Aberta das 14h às 3h." }
          ],
          hooks: [],
          npcs: ["Prex \"Parafuso\" Daan, mecânico", "Marreth, dona da Ferrugem Dourada"] },
        { id: "labirinto", name: "Labirinto Comercial", kind: "Mercado e becos", color: "#f2b544", at: [0.52, 0.70],
          h: [1.5, 5], density: 0.97, tower: 0.03, clutter: 0.30, bridge: 0.10, threat: 3,
          control: "Comerciantes independentes",
          blurb: "Becos apertados que convergem, mercados de sucata e fendas comerciais sob passarelas suspensas, com telhados baixos que emendam uns nos outros. As poças de chuva ácida fumegam no chão. Aqui se compra de tudo, e se perde qualquer um de vista.",
          sites: [],
          hooks: [],
          npcs: [] },
        { id: "imperial", name: "Distrito Imperial", kind: "Perímetro fortificado", color: "#8fa3bd",
          style: "imperial", labelAt: [18, 51], h: [2, 4], density: 0.86, tower: 0, threat: 4,
          control: "O Destacamento Imperial",
          blurb: "Uma ilha murada de geometria imperial cravada numa cidade de ferrugem. Odiada e temida em igual medida: entra-se de cabeça baixa e reza-se para sair.",
          sites: [
            { name: "Consulado Imperial", at: [27, 39], note: "Três andares de face lisa na fronteira fortificada, com a antena relé principal no topo." }
          ],
          hooks: [],
          npcs: ["Tenente Daren Voss, comandante da guarnição"] },
        { id: "limpo", name: "Distrito Limpo", kind: "Núcleo imperial", color: "#dfe8f2",
          style: "imperial", noLabel: true, h: [2, 3], density: 0.8, tower: 0, threat: 4,
          control: "O Destacamento Imperial",
          blurb: "O único pedaço reto, iluminado e estéril de Ossei. Chão liso, luz branca uniforme, cheiro de desinfetante, silêncio vigiado.",
          sites: [
            { name: "Depósito Imperial", at: [14, 45], note: "Armazém alfandegário fortificado, com antena de retransmissão no telhado." },
            { name: "A Praça Limpa & A Fila", at: [21, 39], noLabel: true, note: "Praça de telas e estandartes imperiais, e a fila ao lado: permissões, rações, salvo-condutos, horas de espera." }
          ],
          hooks: [],
          npcs: [] },
        { id: "porto", name: "Porto Baixo", kind: "Bocas dos hangares", color: "#39b8a8", at: [0.80, 0.56],
          h: [1, 2.6], density: 0.42, tower: 0, clutter: 0.05, bridge: 0, threat: 3,
          control: "A Guilda dos Ventos",
          blurb: "Sete bocas de hangar abertas nas fundações para as naves esperarem o tempo passar. Aqui em cima há só pátio, galpões baixos e o pedágio da Guilda. Toda carga que cruza a atmosfera passa por aqui ou paga.",
          sites: [
            { name: "Boca do Hangar 6", at: [58, 42], note: "Um dos sete poços." }
          ],
          hooks: [],
          npcs: ["Senna Oru", "Cálice"] }
      ] },
    { id: "under", name: "Subterrâneo", sub: "Sob as ruas", level: "−1",
      blurb: "As fundações da velha estação, logo abaixo das ruas. Os hangares do Porto Baixo são a única parte que qualquer um conhece. Dizem que há túneis antigos por baixo da cidade inteira, mas quem sabe o caminho não desenha mapas.",
      zones: [
        { id: "hangares", name: "Porto Baixo — Hangares", kind: "Sete hangares", color: "#39b8a8", threat: 3,
          control: "A Guilda dos Ventos",
          blurb: "Sete hangares profundos escavados nas fundações de Ossei para proteger cargueiros e caças do clima corrosivo, alinhados num corredor de serviço. Base, pista e alfândega da Guilda.",
          sites: [
            { name: "Hangar 6", at: [58, 42], note: "Um dos sete hangares." }
          ],
          hooks: [],
          npcs: ["Senna Oru", "Cálice"] }
      ] },
    { id: "deep", name: "As Profundezas", sub: "Abaixo das fundações", level: "−2",
      blurb: "Abaixo das fundações, onde a estação de fato minerava. Não existe mapa. Ninguém na superfície diz saber o que sobrou lá embaixo.",
      zones: [] }
  ];
  /* DATA:END */

  var $ = function (id) { return document.getElementById(id); };
  var PERIOD = CITY.blockSize + 1;
  var N = CITY.blocksPerSide * PERIOD + 1;
  var CELL = CITY.cell;
  var M_PER_UNIT = 5;
  var MAX_H = CITY.maxHeightM / M_PER_UNIT;
  var GAP = 46;                      // espaçamento vertical entre camadas na vista empilhada
  var NL = LAYERS.length;

  var ZONES = [];
  var gi = {};
  LAYERS.forEach(function (Ly, L) {
    Ly.zones.forEach(function (Z) { Z.L = L; Z.g = ZONES.length; gi[Z.id] = Z.g; ZONES.push(Z); });
  });

  // ----- ruído / rng -----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash2(x, y, s) {
    var h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, y, s) {
    var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function cellX(i) { return (i - N / 2 + 0.5) * CELL; }
  function at(i, j) { return j * N + i; }

  // ----- mapas de células: índice da zona (-1 = nenhuma) e tipo, por camada -----
  // superfície: 0 lote, 1 rua, 2 pedra aberta fora da cidade, 3 poço de hangar, 4 praça
  // enterradas: 0 rocha, 1 piso de câmara, 2 túnel
  var ZC = [], K = [];
  for (var l0 = 0; l0 < NL; l0++) { ZC.push(new Int16Array(N * N).fill(-1)); K.push(new Uint8Array(N * N)); }

  // Porto Baixo: sete hangares [i, j] de 7 x 6 células num corredor comum. Existem em duas camadas.
  var HANGARS = [[46, 24], [55, 24], [46, 32], [55, 32], [46, 40], [55, 40], [50, 48]];
  var HW = 7, HH = 6;
  function nearHangar(i, j, m) {
    for (var k = 0; k < HANGARS.length; k++) {
      var h = HANGARS[k];
      if (i >= h[0] - m && i < h[0] + HW + m && j >= h[1] - m && j < h[1] + HH + m) return true;
    }
    return false;
  }
  function inPit(i, j) {
    for (var k = 0; k < HANGARS.length; k++) {
      var h = HANGARS[k];
      if (i >= h[0] + 1 && i <= h[0] + 5 && j >= h[1] + 1 && j <= h[1] + 4) return true;
    }
    return false;
  }

  var reserved = new Uint8Array(N * N);
  LANDMARKS.forEach(function (m) {
    for (var dj = 0; dj < m[4]; dj++) for (var di = 0; di < m[3]; di++) reserved[at(m[1] + di, m[2] + dj)] = 1;
  });
  reserved[at(31, 15)] = 1; reserved[at(32, 15)] = 1;

  // --- superfície: os distritos imperiais são retângulos exatos de quadras; o resto é torto ---
  (function () {
    var free = LAYERS[0].zones.filter(function (Z) { return Z.at; });
    for (var j = 0; j < N; j++) {
      for (var i = 0; i < N; i++) {
        var q = at(i, j);
        var u = (i + 0.5) / N, v = (j + 0.5) / N;
        var inImp = i >= 6 && i <= 30 && j >= 30 && j <= 54;
        var inLimpo = i >= 12 && i <= 24 && j >= 36 && j <= 48;
        var port = nearHangar(i, j, 2);
        var du = (u - 0.5) * 2, dv = (v - 0.5) * 2;
        var edge = 0.93 + (vnoise(u * 4, v * 4, 7) - 0.5) * 0.22;
        if (!inImp && !port && Math.sqrt(du * du + dv * dv) > edge) { K[0][q] = 2; continue; }
        var g;
        if (inLimpo) g = gi.limpo;
        else if (inImp) g = gi.imperial;
        else if (port) g = gi.porto;
        else {
          var wu = u + (vnoise(u * 5, v * 5, 11) - 0.5) * 0.14;
          var wv = v + (vnoise(u * 5, v * 5, 12) - 0.5) * 0.14;
          var bd = 1e9;
          for (var k = 0; k < free.length; k++) {
            var dx = wu - free[k].at[0], dy = wv - free[k].at[1], dd = dx * dx + dy * dy;
            if (dd < bd) { bd = dd; g = free[k].g; }
          }
        }
        ZC[0][q] = g;
        var Z = ZONES[g];
        var kd = (i % PERIOD === 0 || j % PERIOD === 0) ? 1 : 0;
        // becos construídos por cima: o labirinto é o que sobrou da malha
        if (kd === 1 && Z.clutter && hash2(i, j, 57) < Z.clutter) kd = 0;
        if (g === gi.porto && inPit(i, j)) kd = 3;
        if (i >= 19 && i <= 23 && j >= 37 && j <= 41) kd = 4;   // A Praça Limpa
        K[0][q] = kd;
      }
    }
  })();

    kind.appendChild(document.createTextNode(LAYERS[Z.L].name + " · " + Z.kind));
    dossier.appendChild(kind);
    dossier.appendChild(el("h3", null, Z.name));
    if (Z.canon === false) dossier.appendChild(el("div", "chip", "Traçado é interpretação do mapa, não fixado pela lore"));
    dossier.appendChild(el("p", null, Z.blurb));
    dossier.appendChild(el("p", "ctl", "Controle: " + Z.control));
    dossier.appendChild(statRow(Z.L === 0
      ? [[String(s.n), "Construções"], [meters(s.sum / Math.max(1, s.n)) + " m", "Altura média"], [meters(s.max) + " m", "Mais alta"]]
      : [[hectares(s.cells) + " ha", "Área"], [String(Z.sites.length), "Locais"], [LAYERS[Z.L].level, "Nível"]]));
    var pips = el("div", "pips"); pips.appendChild(document.createTextNode("Ameaça "));
    for (var p = 1; p <= 5; p++) pips.appendChild(el("span", "p" + (p <= Z.threat ? " on" : "")));
    dossier.appendChild(pips);
    if (Z.sites.length) {
      var sb = el("div", "sub"); sb.appendChild(el("h4", null, "Locais"));
      var ul = el("ul");
      Z.sites.forEach(function (S) { var li = el("li"); li.appendChild(el("b", null, S.name)); li.appendChild(document.createTextNode(". " + S.note)); ul.appendChild(li); });
      sb.appendChild(ul); dossier.appendChild(sb);
    }
    if (Z.hooks.length) dossier.appendChild(subList("Ganchos de trama", Z.hooks));
    if (Z.npcs.length) dossier.appendChild(subList(CITY.npcLabel, Z.npcs));
  }

  // ----- voos de câmera -----
  var flight = null;
  function flyTo(pos, target, ms) {
    flight = { t0: performance.now(), ms: ms || 900, p0: camera.position.clone(), t0v: controls.target.clone(), p1: pos, t1: target };
  }
  function home() { var H = view === "all" ? HOME_ALL : HOME; flyTo(H.pos.clone(), H.target.clone()); }

  function setView(v, fly) {
    view = v;
    for (var L = 0; L < NL; L++) {
      groups[L].visible = shown(L);
      groups[L].position.y = v === "all" ? -L * GAP : 0;
    }
    links.visible = v === "all";
    apron.visible = v !== "all";
    scene.fog.density = v === "all" ? 0.0015 : 0.0038;
    controls.maxDistance = v === "all" ? 460 : 280;
    if (sel >= 0 && !shown(ZONES[sel].L)) sel = -1;
    hov = -1;
    layerBtns.forEach(function (b) { b.el.setAttribute("aria-pressed", b.v === v ? "true" : "false"); });
    $("compass").textContent = "N ↑ · " + CITY.name + " · " + (v === "all" ? "todas as camadas" : LAYERS[v].name);
    refreshColors(); buildList(); renderDossier();
    if (fly) home();
  }

  function select(g, fly) {
    if (g >= 0 && !shown(ZONES[g].L)) setView(ZONES[g].L, false);
    sel = g;
    refreshColors(); refreshList(); renderDossier();
    if (!fly) return;
    if (g < 0) { home(); return; }
    var target = new THREE.Vector3(stats[g].cx, groups[ZONES[g].L].position.y + 4, stats[g].cz);
    var dir = camera.position.clone().sub(controls.target); dir.y = Math.max(dir.y, dir.length() * 0.5); dir.setLength(view === "all" ? 110 : 78);
    flyTo(target.clone().add(dir), target);
  }

  // ----- seleção com o ponteiro -----
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  var pointer = { x: 0, y: 0, inside: false, dirty: false, downX: 0, downY: 0 };
  var tip = $("tip");
  function pick() {
    var r = canvas.getBoundingClientRect();
    ndc.set(((pointer.x - r.left) / r.width) * 2 - 1, -((pointer.y - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    var hits = ray.intersectObjects(pickables.filter(function (m) { return shown(m.userData.L); }), false);
    if (!hits.length) return -1;
    return hits[0].object.userData.arr[hits[0].instanceId].g;
  }
  function updateHover() {
    pointer.dirty = false;
    var g = pointer.inside ? pick() : -1;
    if (g !== hov) { hov = g; refreshColors(); }
    if (g >= 0) {
      var r = stage.getBoundingClientRect();
      tip.hidden = false;
      tip.replaceChildren(document.createTextNode(ZONES[g].name));
      tip.appendChild(el("small", null, LAYERS[ZONES[g].L].name + " · " + ZONES[g].kind));
      tip.style.left = (pointer.x - r.left) + "px"; tip.style.top = (pointer.y - r.top) + "px";
      canvas.style.cursor = "pointer";
    } else { tip.hidden = true; canvas.style.cursor = ""; }
  }
  canvas.addEventListener("pointermove", function (e) { pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = true; pointer.dirty = true; });
  canvas.addEventListener("pointerleave", function () { pointer.inside = false; pointer.dirty = true; });
  canvas.addEventListener("pointerdown", function (e) { pointer.downX = e.clientX; pointer.downY = e.clientY; flight = null; });
  canvas.addEventListener("pointerup", function (e) {
    if (Math.abs(e.clientX - pointer.downX) + Math.abs(e.clientY - pointer.downY) > 8) return;
    pointer.x = e.clientX; pointer.y = e.clientY;
    var g = pick();
    if (g >= 0) toggle(g);
    else if (sel >= 0) select(-1, false);
  });

  // ----- controles -----
  $("reset").addEventListener("click", function () { select(-1, false); home(); });
  $("showLabels").addEventListener("change", function (e) { labelsOn = e.target.checked; });
  $("showSites").addEventListener("change", function (e) { sitesOn = e.target.checked; });
  document.title = CITY.title;
  $("eyebrow").textContent = CITY.eyebrow;
  $("cityName").textContent = CITY.name;
  $("lede").textContent = CITY.lede;
  $("scale").textContent = "Mapa fixo. 1 célula = 10 m, 1 quadra = 60 m, a cidade tem cerca de " + (N * 10) + " m de lado a lado. O espaçamento entre camadas na vista empilhada não está em escala.";

  // ----- redimensionamento + laço -----
  function resize() {
    var w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener("resize", resize);

  var LIM = (N * CELL) / 2;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function frame(now) {
    requestAnimationFrame(frame);
    if (flight) {
      var t = Math.min(1, (now - flight.t0) / (reduce ? 1 : flight.ms));
      var e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      camera.position.lerpVectors(flight.p0, flight.p1, e);
      controls.target.lerpVectors(flight.t0v, flight.t1, e);
      if (t >= 1) flight = null;
    }
    controls.target.x = Math.max(-LIM, Math.min(LIM, controls.target.x));
    controls.target.z = Math.max(-LIM, Math.min(LIM, controls.target.z));
    controls.update();
    if (pointer.dirty) updateHover();
    updateLabels();
    renderer.render(scene, camera);
  }

  resize();
  setView(0, false);
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
