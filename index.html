<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ossei — Mapa da Cidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: palco 3D de altura total à esquerda, coluna de dossiê à direita. Visual escuro único, por escolha. */
:root {
  --bg: #070b12;
  --panel: #0c1320;
  --panel-2: #111b2b;
  --line: #1d2b40;
  --fg: #d6dfeb;
  --muted: #8393ab;
  --accent: #f2b544;
  --accent-ink: #1a1203;
  --display: "Chakra Petch", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body); overflow: hidden; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.stage { position: relative; min-width: 0; min-height: 0; background: var(--bg); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
.label-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.dlabel {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase;
  color: var(--fg); background: rgba(7, 11, 18, .78); border: 1px solid var(--line);
  padding: 5px 8px; white-space: nowrap; will-change: transform;
}
.dlabel i { display: inline-block; width: 8px; height: 8px; margin-right: 7px; vertical-align: -1px; }
.dlabel[data-on="true"] { border-color: var(--accent); color: #fff; }
.slabel {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  font: 500 10px/1 var(--mono); letter-spacing: .04em; color: var(--fg);
  background: rgba(7, 11, 18, .6); padding: 3px 5px; white-space: nowrap; will-change: transform;
}
.slabel::before { content: "\25C6"; color: var(--accent); margin-right: 5px; font-size: 8px; vertical-align: 1px; }
.tip {
  position: absolute; pointer-events: none; z-index: 3; padding: 6px 9px;
  font: 500 12px/1.3 var(--body); background: var(--panel); border: 1px solid var(--line); color: var(--fg);
  transform: translate(14px, 14px); white-space: nowrap;
}
.tip small { display: block; color: var(--muted); font: 400 11px/1.3 var(--mono); }
.hint {
  position: absolute; left: 16px; bottom: 14px; right: 16px; pointer-events: none;
  font: 400 11px/1.4 var(--mono); color: var(--muted); letter-spacing: .02em;
}
.lang {
  position: absolute; left: 16px; top: 10px; z-index: 4; display: flex;
  border: 1px solid var(--line); background: rgba(7, 11, 18, .78);
}
.lang button {
  background: transparent; color: var(--muted); border: 0; padding: 7px 11px; cursor: pointer;
  font: 600 11px/1 var(--display); letter-spacing: .12em;
}
.lang button + button { border-left: 1px solid var(--line); }
.lang button:hover { color: var(--fg); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.compass {
  position: absolute; right: 16px; top: 14px; pointer-events: none;
  font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
}
aside { min-height: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 700 26px/1.1 var(--display); letter-spacing: .02em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); font-size: 13px; }
.chip {
  align-self: flex-start; font: 500 11px/1.3 var(--mono); padding: 5px 7px; color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
}
h2 { margin: 0 0 8px; font: 600 12px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.layers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.layer {
  text-align: left; padding: 9px 10px; background: transparent; color: var(--fg); border: 1px solid var(--line); cursor: pointer;
  font: 600 12px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase;
}
.layer small { display: block; margin-top: 4px; font: 400 10px/1.2 var(--mono); letter-spacing: .04em; color: var(--muted); text-transform: none; }
.layer:hover { background: var(--panel-2); }
.layer[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-2); color: #fff; }
.dossier { border: 1px solid var(--line); background: var(--panel-2); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.dossier h3 { margin: 0; font: 700 22px/1.15 var(--display); text-wrap: balance; }
.kind { font: 500 11px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.kind i { width: 10px; height: 10px; display: inline-block; flex: none; }
.dossier p { margin: 0; color: var(--fg); max-width: 62ch; }
.dossier p.ctl { font: 400 12px/1.4 var(--mono); color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { border-top: 1px solid var(--line); padding-top: 6px; min-width: 0; }
.stat b { display: block; font: 500 16px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font: 400 11px/1.3 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pips { display: flex; gap: 4px; align-items: center; font: 500 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.pips span.p { width: 18px; height: 6px; background: var(--line); }
.pips span.p.on { background: var(--accent); }
.sub { display: flex; flex-direction: column; gap: 4px; }
.sub ul { margin: 0; padding-left: 18px; color: var(--fg); }
.sub li { margin: 2px 0; }
.sub li b { font-weight: 500; color: #fff; }
.sub h4 { margin: 0; font: 600 11px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 6px; }
.list h5 { margin: 8px 0 0; font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.list h5:first-child { margin-top: 0; }
.list p { margin: 0; font: 400 12px/1.5 var(--mono); color: var(--muted); }
.row {
  display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left;
  width: 100%; padding: 9px 10px; background: transparent; color: var(--fg); border: 1px solid var(--line);
  font: 500 13px/1.2 var(--body); cursor: pointer;
}
.row:hover { background: var(--panel-2); }
.row[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-2); }
.row i { width: 12px; height: 12px; display: block; }
.row em { font: 400 11px/1 var(--mono); font-style: normal; color: var(--muted); }
button:focus-visible, input:focus-visible, .dlabel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.view { display: flex; flex-direction: column; gap: 12px; }
.btn {
  align-self: flex-start; background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 8px 12px;
  font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
}
.btn:hover { background: var(--panel-2); }
.check { display: flex; align-items: center; gap: 8px; font: 400 13px/1.2 var(--body); color: var(--fg); }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.scale { font: 400 11px/1.5 var(--mono); color: var(--muted); }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 48%); }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  h1 { font-size: 22px; }
  .hint { display: none; }
}
</style>
</head>
<body>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="gl" data-i18n-aria="canvas" aria-label="Mapa 3D de Ossei. Arraste para orbitar, role para aproximar, arraste com o botão direito para mover."></canvas>
    <div class="label-layer" id="labels"></div>
    <div class="tip" id="tip" hidden></div>
    <div class="lang" id="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="pt" lang="pt-BR">PT-BR</button>
      <button type="button" data-lang="en" lang="en">ENG</button>
    </div>
    <div class="compass" id="compass"></div>
    <div class="hint" data-i18n="hint">Arraste para orbitar &middot; role para aproximar &middot; botão direito para mover &middot; clique em uma zona</div>
  </div>
  <aside>
    <div class="head">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="cityName"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <section>
      <h2 data-i18n="layer">Camada</h2>
      <div class="layers" id="layers"></div>
    </section>
    <section>
      <h2 data-i18n="dossier">Dossiê</h2>
      <div class="dossier" id="dossier" aria-live="polite"></div>
    </section>
    <section>
      <h2 data-i18n="zones">Zonas</h2>
      <div class="list" id="list"></div>
    </section>
    <section>
      <h2 data-i18n="display">Visualização</h2>
      <div class="view">
        <label class="check"><input id="showLabels" type="checkbox" checked> <span data-i18n="showLabels">Mostrar rótulos das zonas</span></label>
        <label class="check"><input id="showSites" type="checkbox" checked> <span data-i18n="showSites">Mostrar locais nomeados</span></label>
        <button class="btn" id="reset" type="button" data-i18n="reset">Restaurar vista</button>
        <div class="scale" id="scale"></div>
      </div>
    </section>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  // colares dos eixos em cada camada que tocam, e as ligações que aparecem na vista empilhada
  var links = new THREE.Group();
  scene.add(links);
  (function () {
    var ringGeo = new THREE.CylinderGeometry(0.85, 0.85, 0.3, 20);
    var ringMat = new THREE.MeshBasicMaterial({ color: 0xf2b544 });
    var linkMat = new THREE.MeshBasicMaterial({ color: 0xf2b544, transparent: true, opacity: 0.5, depthWrite: false });
    var pitMat = new THREE.MeshBasicMaterial({ color: 0x39b8a8, transparent: true, opacity: 0.32, depthWrite: false });
    function link(x, z, a, b, r, mat) {
      var m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, (b - a) * GAP, 10), mat);
      m.position.set(x, -(a + b) / 2 * GAP, z);
      links.add(m);
    }
    SHAFTS.forEach(function (s) {
      for (var l = s.a; l <= s.b; l++) {
        var r = new THREE.Mesh(ringGeo, ringMat);
        r.position.set(cellX(s.i), 0.2, cellX(s.j));
        groups[l].add(r);
      }
      link(cellX(s.i), cellX(s.j), s.a, s.b, 0.3, linkMat);
    });
    if (gi.hangares != null) HANGARS.forEach(function (h) { link(cellX(h[0] + 3), cellX(h[1] + 2.5), 0, ZONES[gi.hangares].L, 1.6, pitMat); });
  })();

  // ----- estado de vista / seleção / hover -----
  var view = 0;            // índice de camada, ou "all"
  var sel = -1, hov = -1;
  var tmpC = new THREE.Color();
  function shown(L) { return view === "all" || view === L; }
  function shade(base, g) {
    tmpC.copy(base);
    if (sel >= 0) {
      if (g === sel) tmpC.lerp(white, 0.22);
      else tmpC.multiplyScalar(0.42);
    }
    if (g >= 0 && g === hov && g !== sel) tmpC.lerp(white, 0.2);
    return tmpC;
  }
  function refreshColors() {
    for (var L = 0; L < NL; L++) {
      var tm = groups[L].userData.tiles, bm = groups[L].userData.blocks, k;
      for (k = 0; k < T[L].length; k++) tm.setColorAt(k, shade(T[L][k].base, T[L][k].g));
      for (k = 0; k < BL[L].length; k++) bm.setColorAt(k, shade(BL[L][k].base, BL[L][k].g));
      tm.instanceColor.needsUpdate = true;
      bm.instanceColor.needsUpdate = true;
    }
  }

  // ----- DOM -----
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function meters(u) { return Math.round(u * M_PER_UNIT); }
  function hectares(cells) { return (cells / 100).toFixed(1).replace(".", ","); }
  function toggle(g) { select(sel === g ? -1 : g, true); }

  // ----- rótulos -----
  var labelLayer = $("labels");
  var labelsOn = true, sitesOn = true;
  var zoneLabels = ZONES.map(function (Z, g) {
    var e = el("div", "dlabel");
    e.tabIndex = 0;
    e.setAttribute("role", "button");
    var sw = el("i"); sw.style.background = Z.color;
    e.appendChild(sw);
    e.appendChild(e.txt = document.createTextNode(Z.name));
    e.addEventListener("click", function () { toggle(g); });
    e.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(g); } });
    labelLayer.appendChild(e);
    return e;
  });
  var siteLabels = [];
  ZONES.forEach(function (Z, g) {
    Z.sites.forEach(function (S) {
      if (S.noLabel) return;
      var e = el("div", "slabel", S.name);
      e.addEventListener("click", function () { select(g, true); });
      labelLayer.appendChild(e);
      siteLabels.push({ el: e, g: g, s: S, x: cellX(S.at[0]), z: cellX(S.at[1]) });
    });
  });
  var proj = new THREE.Vector3();
  function place(e, x, y, z, dy) {
    proj.set(x, y, z).project(camera);
    if (proj.z > 1 || proj.z < -1) { e.style.display = "none"; return; }
    e.style.display = "";
    var px = (proj.x * 0.5 + 0.5) * stage.clientWidth, py = (-proj.y * 0.5 + 0.5) * stage.clientHeight;
    e.style.transform = "translate(" + Math.round(px - e.offsetWidth / 2) + "px," + Math.round(py - dy) + "px)";
  }
  function updateLabels() {
    var k;
    for (k = 0; k < zoneLabels.length; k++) {
      var Z = ZONES[k], e = zoneLabels[k];
      if (!labelsOn || Z.noLabel || !shown(Z.L)) { e.style.display = "none"; continue; }
      place(e, stats[k].cx, groups[Z.L].position.y + (Z.L === 0 ? stats[k].max * 0.55 + 4 : 5), stats[k].cz, 12);
      e.dataset.on = (k === sel) ? "true" : "false";
    }
    for (k = 0; k < siteLabels.length; k++) {
      var S = siteLabels[k], SL = ZONES[S.g].L;
      // na vista empilhada só a zona selecionada mostra seus locais, para continuar legível
      if (!sitesOn || !shown(SL) || (view === "all" && S.g !== sel)) { S.el.style.display = "none"; continue; }
      place(S.el, S.x, groups[SL].position.y + (SL === 0 ? 4.5 : 2.5), S.z, 8);
    }
  }

  // ----- barra lateral -----
  var layerBtns = [];
  function buildLayerBtns() {
    var box = $("layers");
    box.replaceChildren();
    layerBtns = [];
    LAYERS.map(function (Ly, L) { return { v: L, name: Ly.name, sub: Ly.sub }; })
      .concat([{ v: "all", name: tr("allLayers"), sub: tr("allLayersSub") }])
      .forEach(function (o) {
        var b = el("button", "layer", o.name);
        b.type = "button";
        b.appendChild(el("small", null, o.sub));
        b.setAttribute("aria-pressed", o.v === view ? "true" : "false");
        b.addEventListener("click", function () { setView(o.v, true); });
        box.appendChild(b);
        layerBtns.push({ v: o.v, el: b });
      });
  }
  buildLayerBtns();

  var listEl = $("list");
  var rowEls = [];
  function buildList() {
    listEl.replaceChildren();
    rowEls = [];
    LAYERS.forEach(function (Ly, L) {
      if (!shown(L)) return;
      if (view === "all") listEl.appendChild(el("h5", null, Ly.name));
      if (!Ly.zones.length) listEl.appendChild(el("p", null, tr("nothing")));
      Ly.zones.forEach(function (Z) {
        var b = el("button", "row");
        b.type = "button";
        var sw = el("i"); sw.style.background = Z.color;
        b.appendChild(sw);
        b.appendChild(el("span", null, Z.name));
        b.appendChild(el("em", null, L === 0 ? tr("upTo") + meters(stats[Z.g].max) + " m" : hectares(stats[Z.g].cells) + " ha"));
        b.addEventListener("click", function () { toggle(Z.g); });
        listEl.appendChild(b);
        rowEls.push({ g: Z.g, el: b });
      });
    });
    refreshList();
  }
  function refreshList() {
    rowEls.forEach(function (r) { r.el.setAttribute("aria-pressed", r.g === sel ? "true" : "false"); });
  }

  var dossier = $("dossier");
  function stat(v, l) { var s = el("div", "stat"); s.appendChild(el("b", null, v)); s.appendChild(el("span", null, l)); return s; }
  function statRow(items) { var g = el("div", "stats"); items.forEach(function (it) { g.appendChild(stat(it[0], it[1])); }); return g; }
  function subList(title, items) {
    var s = el("div", "sub"); s.appendChild(el("h4", null, title));
    var ul = el("ul"); items.forEach(function (t) { ul.appendChild(el("li", null, t)); }); s.appendChild(ul); return s;
  }
  function renderDossier() {
    dossier.replaceChildren();
    if (sel < 0) {
      var zs = ZONES.filter(function (Z) { return shown(Z.L); });
      var sites = zs.reduce(function (n, Z) { return n + Z.sites.length; }, 0);
      if (view === "all") {
        dossier.appendChild(el("h3", null, CITY.name + tr("inSection")));
        dossier.appendChild(el("p", null, CITY.section));
        dossier.appendChild(statRow([[String(NL), tr("layers")], [String(zs.length), tr("zones")], [String(sites), tr("sites")]]));
      } else {
        var Ly = LAYERS[view];
        dossier.appendChild(el("div", "kind", tr("level") + Ly.level));
        dossier.appendChild(el("h3", null, Ly.name));
        dossier.appendChild(el("p", null, Ly.blurb));
        var ways = SHAFTS.filter(function (s) { return s.a <= view && s.b >= view; }).length
          + (gi.hangares != null && ZONES[gi.hangares].L === view ? HANGARS.length : 0);
        var third = view === 0 ? [CITY.maxHeightM + " m", tr("maxHeight")] : [ways ? String(ways) : "?", tr("access")];
        dossier.appendChild(statRow([[String(zs.length), tr("zones")], [String(sites), tr("sites")], third]));
      }
      return;
    }
    var Z = ZONES[sel], s = stats[sel];
    var kind = el("div", "kind"); var sw = el("i"); sw.style.background = Z.color; kind.appendChild(sw);
    kind.appendChild(document.createTextNode(LAYERS[Z.L].name + " · " + Z.kind));
    dossier.appendChild(kind);
    dossier.appendChild(el("h3", null, Z.name));
    if (Z.canon === false) dossier.appendChild(el("div", "chip", tr("notCanon")));
    dossier.appendChild(el("p", null, Z.blurb));
    dossier.appendChild(el("p", "ctl", tr("control") + Z.control));
    dossier.appendChild(statRow(Z.L === 0
      ? [[String(s.n), tr("buildings")], [meters(s.sum / Math.max(1, s.n)) + " m", tr("avgHeight")], [meters(s.max) + " m", tr("tallest")]]
      : [[hectares(s.cells) + " ha", tr("area")], [String(Z.sites.length), tr("sites")], [LAYERS[Z.L].level, tr("levelStat")]]));
    var pips = el("div", "pips"); pips.appendChild(document.createTextNode(tr("threat")));
    for (var p = 1; p <= 5; p++) pips.appendChild(el("span", "p" + (p <= Z.threat ? " on" : "")));
    dossier.appendChild(pips);
    if (Z.sites.length) {
      var sb = el("div", "sub"); sb.appendChild(el("h4", null, tr("sites")));
      var ul = el("ul");
      Z.sites.forEach(function (S) { var li = el("li"); li.appendChild(el("b", null, S.name)); li.appendChild(document.createTextNode(". " + S.note)); ul.appendChild(li); });
      sb.appendChild(ul); dossier.appendChild(sb);
    }
    if (Z.hooks.length) dossier.appendChild(subList(tr("hooks"), Z.hooks));
    if (Z.npcs.length) dossier.appendChild(subList(CITY.npcLabel, Z.npcs));
  }

  // ----- voos de câmera -----
  var flight = null;
  function flyTo(pos, target, ms) {
    flight = { t0: performance.now(), ms: ms || 900, p0: camera.position.clone(), t0v: controls.target.clone(), p1: pos, t1: target };
  }
  function home() { var H = view === "all" ? HOME_ALL : HOME; flyTo(H.pos.clone(), H.target.clone()); }

  function updateCompass() {
    $("compass").textContent = "N ↑ · " + CITY.name + " · " + (view === "all" ? tr("allLayersLower") : LAYERS[view].name);
  }

  function setView(v, fly) {
    view = v;
    for (var L = 0; L < NL; L++) {
      groups[L].visible = shown(L);
      groups[L].position.y = v === "all" ? -L * GAP : 0;
    }
    links.visible = v === "all";
    apron.visible = v !== "all";
    scene.fog.density = v === "all" ? 0.0015 : 0.0038;
    controls.maxDistance = v === "all" ? 460 : 280;
    if (sel >= 0 && !shown(ZONES[sel].L)) sel = -1;
    hov = -1;
    layerBtns.forEach(function (b) { b.el.setAttribute("aria-pressed", b.v === v ? "true" : "false"); });
    updateCompass();
    refreshColors(); buildList(); renderDossier();
    if (fly) home();
  }

  function select(g, fly) {
    if (g >= 0 && !shown(ZONES[g].L)) setView(ZONES[g].L, false);
    sel = g;
    refreshColors(); refreshList(); renderDossier();
    if (!fly) return;
    if (g < 0) { home(); return; }
    var target = new THREE.Vector3(stats[g].cx, groups[ZONES[g].L].position.y + 4, stats[g].cz);
    var dir = camera.position.clone().sub(controls.target); dir.y = Math.max(dir.y, dir.length() * 0.5); dir.setLength(view === "all" ? 110 : 78);
    flyTo(target.clone().add(dir), target);
  }

  // ----- seleção com o ponteiro -----
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  var pointer = { x: 0, y: 0, inside: false, dirty: false, downX: 0, downY: 0 };
  var tip = $("tip");
  function pick() {
    var r = canvas.getBoundingClientRect();
    ndc.set(((pointer.x - r.left) / r.width) * 2 - 1, -((pointer.y - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    var hits = ray.intersectObjects(pickables.filter(function (m) { return shown(m.userData.L); }), false);
    if (!hits.length) return -1;
    return hits[0].object.userData.arr[hits[0].instanceId].g;
  }
  function updateHover() {
    pointer.dirty = false;
    var g = pointer.inside ? pick() : -1;
    if (g !== hov) { hov = g; refreshColors(); }
    if (g >= 0) {
      var r = stage.getBoundingClientRect();
      tip.hidden = false;
      tip.replaceChildren(document.createTextNode(ZONES[g].name));
      tip.appendChild(el("small", null, LAYERS[ZONES[g].L].name + " · " + ZONES[g].kind));
      tip.style.left = (pointer.x - r.left) + "px"; tip.style.top = (pointer.y - r.top) + "px";
      canvas.style.cursor = "pointer";
    } else { tip.hidden = true; canvas.style.cursor = ""; }
  }
  canvas.addEventListener("pointermove", function (e) { pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = true; pointer.dirty = true; });
  canvas.addEventListener("pointerleave", function () { pointer.inside = false; pointer.dirty = true; });
  canvas.addEventListener("pointerdown", function (e) { pointer.downX = e.clientX; pointer.downY = e.clientY; flight = null; });
  canvas.addEventListener("pointerup", function (e) {
    if (Math.abs(e.clientX - pointer.downX) + Math.abs(e.clientY - pointer.downY) > 8) return;
    pointer.x = e.clientX; pointer.y = e.clientY;
    var g = pick();
    if (g >= 0) toggle(g);
    else if (sel >= 0) select(-1, false);
  });

  // ----- controles -----
  $("reset").addEventListener("click", function () { select(-1, false); home(); });
  $("showLabels").addEventListener("change", function (e) { labelsOn = e.target.checked; });
  $("showSites").addEventListener("change", function (e) { sitesOn = e.target.checked; });
  function applyStatic() {
    document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
    document.title = CITY.title;
    $("eyebrow").textContent = CITY.eyebrow;
    $("cityName").textContent = CITY.name;
    $("lede").textContent = CITY.lede;
    $("scale").textContent = tr("scale")(N * 10);
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (n) { n.textContent = tr(n.dataset.i18n); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-aria]"), function (n) { n.setAttribute("aria-label", tr(n.dataset.i18nAria)); });
    Array.prototype.forEach.call(document.querySelectorAll("#lang button"), function (b) { b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"); });
  }
  function setLang(l) {
    if (!UI[l] || l === lang) return;
    lang = l;
    try { localStorage.setItem("ossei-lang", l); } catch (e) {}
    applyData(l === "en" ? DATA_EN : DATA_PT);
    applyStatic();
    zoneLabels.forEach(function (e, g) { e.txt.nodeValue = ZONES[g].name; });
    siteLabels.forEach(function (S) { S.el.textContent = S.s.name; });
    buildLayerBtns(); updateCompass(); buildList(); renderDossier();
    tip.hidden = true; hov = -1;
  }
  $("lang").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]");
    if (b) setLang(b.dataset.lang);
  });
  applyStatic();

  // ----- redimensionamento + laço -----
  function resize() {
    var w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener("resize", resize);

  var LIM = (N * CELL) / 2;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function frame(now) {
    requestAnimationFrame(frame);
    if (flight) {
      var t = Math.min(1, (now - flight.t0) / (reduce ? 1 : flight.ms));
      var e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      camera.position.lerpVectors(flight.p0, flight.p1, e);
      controls.target.lerpVectors(flight.t0v, flight.t1, e);
      if (t >= 1) flight = null;
    }
    controls.target.x = Math.max(-LIM, Math.min(LIM, controls.target.x));
    controls.target.z = Math.max(-LIM, Math.min(LIM, controls.target.z));
    controls.update();
    if (pointer.dirty) updateHover();
    updateLabels();
    renderer.render(scene, camera);
  }

  resize();
  setView(0, false);
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
